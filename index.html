<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Time Zone: time zone converter, compare time zone difference and find best time for a meeting with one click</title>
    <style>
        /* CSS Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1b1d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar (Purple Gradient) */
        .top-nav {
            background: linear-gradient(90deg, #370659 0%, #150029 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
            padding: 0 20px;
            border-bottom: 1px solid #111;
        }

        .nav-left {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            margin-right: 15px;
        }

        .menu-icon span {
            display: block;
            height: 2px;
            background-color: #fff;
            border-radius: 2px;
        }

        .menu-icon span:nth-child(1) { width: 20px; }
        .menu-icon span:nth-child(2) { width: 14px; margin-left: 6px; }
        .menu-icon span:nth-child(3) { width: 20px; }

        .brand-name {
            font-size: 16px;
            font-weight: 500;
            margin-right: 15px;
            letter-spacing: 0.3px;
        }

        .tagline {
            font-size: 10px;
            color: #d1b3ff;
            line-height: 1.2;
            padding-left: 15px;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            margin-right: 30px;
        }

        .nav-links {
            display: flex;
            height: 100%;
        }

        .nav-link {
            display: flex;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            padding: 0 16px;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            margin-left: -1px;
            transition: background 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-right {
            display: flex;
            align-items: center;
        }

        .sign-in {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        /* Badges (Pro / New) */
        .badge {
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 6px;
            text-transform: capitalize;
        }

        .badge-outline {
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.8);
        }

        .badge-filled {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid transparent;
        }

        /* Secondary Toolbar */
        .toolbar {
            background-color: #232428;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #111;
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .date-display {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 10px;
        }

        .calendar-icon {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .date-text {
            font-size: 18px;
            font-weight: 700;
            border-bottom: 2px dotted #555;
            padding-bottom: 2px;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            padding: 0 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-blue {
            background-color: #4b8df8;
        }

        .btn-twitter {
            background-color: #1da1f2;
            gap: 6px;
        }

        .twitter-icon {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            background-color: #1e1e20;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="nav-left">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="brand-name">Every Time Zone</div>
            <div class="tagline">Never warp your brain with<br>time zone math again.</div>
            
            <nav class="nav-links">
                <a href="#" class="nav-link active">Timeline</a>
                <a href="#" class="nav-link">Meetings <span class="badge badge-outline">Pro</span></a>
                <a href="#" class="nav-link">People <span class="badge badge-outline">Pro</span></a>
            </nav>
        </div>
        <div class="nav-right">
            <a href="#" class="sign-in">Sign In</a>
        </div>
    </header>

    <!-- Secondary Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="date-display">
                <!-- SVG Calendar Icon -->
                <svg class="calendar-icon" viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
                </svg>
                <div class="date-text">June 28 – July 3</div>
            </div>
            
            <button class="btn btn-blue">Share Link</button>
            <button class="btn btn-blue">Share iCal <span class="badge badge-filled">Pro</span></button>
            <button class="btn btn-twitter">
                <!-- SVG Twitter Icon -->
                <svg class="twitter-icon" viewBox="0 0 24 24">
                    <path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.05c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/>
                </svg>
                Tweet
            </button>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-blue">Customize <span class="badge badge-filled">new</span></button>
        </div>
    </div>

    <!-- Main Content Body (Empty Dark Space as per image) -->
    <main class="main-content">
        <!-- Dashboard components would go here -->
    </main>

</body>
</html>
